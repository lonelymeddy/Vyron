services:
  # ===================================================
  # VYRON AI - Unified Full-Stack Service (Frontend + Backend)
  # Deploys both Next.js & FastAPI together on a single port
  # ===================================================
  - type: web
    name: vyron-unified
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && npm --prefix frontend install && npm --prefix frontend run build"
    startCommand: "python3 start.py"
    envVars:
      - key: APP_NAME
        value: "VYRON AI"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_AI_PROVIDER
        value: mock_engine
      - key: DATABASE_URL
        value: sqlite:///./vyron.db

  # ===================================================
  # Optional: Split Architecture Backend
  # ===================================================
  - type: web
    name: vyron-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. python app/db/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: "VYRON AI"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://vyron-1uaj.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://vyron-1uaj.onrender.com,https://vyron-frontend.onrender.com
      - key: DEFAULT_AI_PROVIDER
        value: mock_engine

  # ===================================================
  # Optional: Split Architecture Frontend
  # ===================================================
  - type: web
    name: vyron-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vyron-1uaj.onrender.com
